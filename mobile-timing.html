<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KINETIC / MOBILE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
:root{
  --bg:#0a0a0c; --panel:#141418; --line:#26262e;
  --text:#eceae4; --muted:#84838c; --amber:#ff9a1f; --cyan:#4fd8e8;
  --red:#ff4d4f; --green:#4ade80; --purple:#b98cff; --yellow:#eab308; --blue:#3b82f6;
  --sat-t:env(safe-area-inset-top,0px); --sat-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0;}
body{background:#000; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:13px;}
/* App frame: fluid edge-to-edge on real phone widths, letterboxed to a phone-proportioned
   column on wider/desktop viewports so nothing stretches into giant, unreadable rows. */
#app{position:relative; max-width:480px; margin:0 auto; height:100%; max-height:100dvh; overflow:hidden; background:var(--bg); padding-top:var(--sat-t);}
@media (min-width:481px){ #app{box-shadow:0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.6);} }
header{display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel);}
.brand{display:flex; align-items:baseline; gap:6px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;}
.brand span{color:var(--red);}
.status{display:flex; align-items:center; gap:10px; font-size:10px; color:var(--muted);}
.status .src{display:flex; align-items:center;}
.dot{width:6px; height:6px; border-radius:50%; background:var(--muted); display:inline-block; margin-right:4px;}
.dot.live{background:var(--green); box-shadow:0 0 6px var(--green); animation:pulse 1.6s infinite;}
.dot.off{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.wxbar{display:none;}
.statusbar{background:var(--panel); border-bottom:1px solid var(--line); padding:9px 14px 10px;}
.sbrow{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:4px;}
.sbrow:first-child{margin-top:0;}
.flagline{display:flex; align-items:center; gap:6px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px;}
.laptxt{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12px; font-variant-numeric:tabular-nums; color:var(--text); flex-shrink:0;}
.wxline{display:flex; align-items:center; gap:5px; color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden;}
.wxline b{color:var(--text); font-weight:500;}
.wxline .unit{font-size:9px; margin-right:4px; color:var(--muted);}
.clocktxt{font-variant-numeric:tabular-nums; font-size:13px; color:var(--amber); flex-shrink:0;}
.clocktxt.danger{color:var(--red);}
.sbrow.rc{font-size:10px; letter-spacing:.3px; text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; justify-content:flex-start;}
main{position:absolute; top:0; bottom:0; left:0; right:0; padding-top:112px; padding-bottom:calc(58px + var(--sat-b)); overflow:hidden;}
.view{display:none; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.view.on{display:block;}
#timingList{padding:2px 0 8px;}
.trow{padding:10px 14px 9px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .15s;}
.trow.selected{background:rgba(79,216,232,.08);}
.trow.pit{background:rgba(255,154,31,.07);}
.trow-top{display:flex; align-items:center; gap:7px;}
.pos{width:16px; font-weight:700; font-size:14px; color:var(--muted); flex-shrink:0; text-align:center;}
.swatch{width:3px; height:15px; border-radius:2px; flex-shrink:0;}
.avatar{width:22px; height:22px; border-radius:50%; object-fit:cover; background:#1c1c22; flex-shrink:0; border:1px solid var(--line);}
.avatar[src=""], .avatar.hidden{visibility:hidden;}
.dname{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:.3px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.teamlogo{height:11px; width:auto; max-width:34px; object-fit:contain; opacity:.85; flex-shrink:0;}
.drspill{font-size:8px; font-weight:700; padding:2px 5px; border-radius:3px; border:1px solid var(--line); color:var(--muted); flex-shrink:0; letter-spacing:.3px;}
.drspill.open{color:var(--green); border-color:var(--green);}
.pitbadge{font-size:8px; background:var(--amber); color:#111; padding:1px 4px; border-radius:2px; font-weight:700; flex-shrink:0;}
.gapcol{margin-left:auto; text-align:right; display:flex; flex-direction:column; gap:1px; flex-shrink:0;}
.gap{font-family:'Space Grotesk',sans-serif; font-size:12.5px; font-weight:700; color:var(--text); white-space:nowrap;}
.gap.leader{color:var(--amber); letter-spacing:.6px; font-size:11px;}
.interval{font-size:9px; color:var(--muted); white-space:nowrap;}
.trow-mid{display:flex; align-items:center; gap:8px; margin-top:7px; margin-left:26px;}
.segbar{display:flex; gap:1.5px; flex:1; height:9px;}
.seg{flex:1; border-radius:1px; background:#2c2c34;}
.seg.g{background:var(--green);} .seg.y{background:var(--amber);} .seg.p{background:var(--purple);} .seg.b{background:var(--blue);}
.tyre-wrap{position:relative; flex-shrink:0; width:22px; height:22px;}
.tyre{width:22px; height:22px; border-radius:50%; border:1.5px solid currentColor; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700;}
.tyre.S{color:var(--red);} .tyre.M{color:var(--amber);} .tyre.H{color:#e8e8e8;} .tyre.I{color:var(--green);} .tyre.W{color:var(--cyan);}
.tyre-age{position:absolute; top:-5px; right:-7px; font-size:8px; color:var(--muted); background:var(--panel); padding:0 2px; border-radius:3px; line-height:1.3;}
.trow-sectors{display:flex; gap:16px; margin-top:5px; margin-left:26px; font-size:10.5px; color:var(--muted);}
.trow-sectors span.g{color:var(--green);} .trow-sectors span.p{color:var(--purple);}
.trow-bottom{display:flex; justify-content:space-between; margin-top:4px; margin-left:26px; font-size:10px; color:var(--muted);}
.trow-bottom b{color:var(--text); font-weight:500;}
.trow-bottom b.fast{color:var(--purple);} .trow-bottom b.pb{color:var(--green);}
.telem{display:flex; gap:9px; margin-top:6px; margin-left:26px; padding-top:6px; border-top:1px dashed var(--line); font-size:9.5px; color:var(--muted); flex-wrap:wrap; row-gap:4px;}
.telem b{color:var(--text); font-weight:600; font-size:11px;}
.telem .drs{padding:1px 6px; border-radius:3px; border:1px solid var(--line);}
.telem .drs.open{color:var(--green); border-color:var(--green);}
.telem .drs.aero.open{color:var(--cyan); border-color:var(--cyan);}
.telem .drs.ot.open{color:var(--purple); border-color:var(--purple); box-shadow:0 0 6px var(--purple);}
.bar{width:34px; height:4px; background:#3a3a42; border-radius:2px; overflow:hidden; display:inline-block; vertical-align:middle; margin-left:3px;}
.bar i{display:block; height:100%; background:var(--cyan);}
.bar.brk i{background:var(--red);}
.empty{color:var(--muted); text-align:center; padding:40px 20px; font-size:12px;}
#trackView{position:relative; height:100%;}
#trackCanvas{width:100%; height:100%; display:block; touch-action:none;}
.track-hint{position:absolute; bottom:12px; left:12px; font-size:10px; color:var(--muted); background:rgba(20,20,24,.8); padding:5px 9px; border-radius:6px;}
#radioList{padding:8px;}
.filterbar{padding:10px 12px 4px;}
.filterbar select{width:100%; appearance:none; -webkit-appearance:none; background:#eceae4 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23141418" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>') no-repeat right 12px center/14px; background-color:#eceae4; color:#141418; border:none; border-radius:20px; padding:10px 34px 10px 16px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600;}
.rcard{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--muted); border-radius:8px; padding:10px 12px; margin-bottom:6px;}
.rcard .rmeta{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:11px;}
.rcard .ravatar{width:22px; height:22px; border-radius:50%; object-fit:cover; background:#1c1c22; border:1px solid var(--line);}
.rcard .rtla{font-weight:700; font-size:12px;}
.rcard .rtime{color:var(--muted); margin-left:auto;}
.player{display:flex; align-items:center; gap:9px; margin-bottom:7px;}
.playbtn{
  width:30px; height:30px; border-radius:50%; border:none; flex-shrink:0; cursor:pointer;
  background:var(--amber); color:#12100c; display:flex; align-items:center; justify-content:center;
  font-size:0; position:relative; transition:transform .1s, background .15s;
}
.playbtn:active{transform:scale(.92);}
.playbtn::before{content:''; width:0; height:0; border-style:solid; border-width:6px 0 6px 10px; border-color:transparent transparent transparent #12100c; margin-left:2px;}
.playbtn.playing::before{width:9px; height:11px; border-style:none; border-width:0; background:#12100c; box-shadow:4px 0 0 #12100c; margin-left:0; border-radius:1px;}
.playbtn.error{background:var(--red);}
.ptrack{flex:1; height:4px; background:#2a2a32; border-radius:2px; position:relative; cursor:pointer;}
.pfill{position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--amber); border-radius:2px;}
.ptime{font-size:10px; color:var(--muted); flex-shrink:0; width:34px; text-align:right;}
.rcard .line{font-size:12px; margin-top:3px;}
.rcard .line b{color:var(--amber); margin-right:6px;}
#rcList{padding:8px;}
.rc-msg{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-bottom:6px; font-size:12px; display:flex; gap:9px; align-items:flex-start;}
.flagchip{flex-shrink:0; font-size:9px; font-weight:700; letter-spacing:.4px; padding:3px 6px; border-radius:3px; margin-top:1px;}
.rc-msg .t{color:var(--muted); font-size:10px; display:block; margin-bottom:2px;}
nav{position:absolute; left:0; right:0; bottom:0; display:flex; background:var(--panel); border-top:1px solid var(--line); padding-bottom:var(--sat-b);}
nav button{flex:1; background:none; border:none; color:var(--muted); font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:500; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:3px;}
nav button svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8;}
nav button.on{color:var(--red);}
::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">KINETIC<span>/</span><span id="sessionName" style="color:var(--muted); font-size:11px; font-weight:400;">—</span></div>
  <div class="status">
    <span class="src"><span class="dot off" id="dotMain"></span>LIVE</span>
    <span class="src"><span class="dot off" id="dotRadio"></span>RADIO</span>
  </div>
</header>
<div class="statusbar">
  <div class="sbrow">
    <span class="flagline"><span id="flagIcon">🏁</span><b id="statusText">Live</b></span>
    <b class="laptxt">Lap <span id="wLap">—</span></b>
  </div>
  <div class="sbrow">
    <span class="wxline"><span id="wxIcon">☀️</span><b id="wAir">—°</b><span class="unit">air</span><b id="wTrack">—°</b><span class="unit">trk</span><span id="wCond">—</span></span>
    <b class="clocktxt" id="wClock">—</b>
  </div>
  <div class="sbrow rc" id="rcTicker">—</div>
</div>
<main>
  <div class="view on" id="view-timing"><div id="timingList"><div class="empty">Connecting to pitwall feed…</div></div></div>
  <div class="view" id="view-track"><div id="trackView"><canvas id="trackCanvas"></canvas><div class="track-hint" id="trackHint">Connecting…</div></div></div>
  <div class="view" id="view-radio">
    <div class="filterbar"><select id="radioFilter"><option value="">Filter by drivers</option></select></div>
    <div id="radioList"><div class="empty">No transcripts yet.</div></div>
  </div>
  <div class="view" id="view-rc"><div id="rcList"><div class="empty">No messages yet.</div></div></div>
</main>
<nav>
  <button class="on" data-view="timing"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Timing</button>
  <button data-view="track"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>Track</button>
  <button data-view="radio"><svg viewBox="0 0 24 24"><path d="M4 12h4l3-7v14l-3-7H4z"/></svg>Radio</button>
  <button data-view="rc"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.9L20 9l-4.6 3.8L16.9 19 12 15.6 7.1 19l1.5-6.2L4 9l5.6-1.1z"/></svg>RC</button>
</nav>
</div>

<script>
/* ============================================================
   MAIN SOURCE — timing / weather / RC / track / telemetry
   pitwall.me feed, ported from track.html
   ============================================================ */
const MAIN_WS = "wss://api.pitwall.me/ws";
let state = {}, dirty = true, wsMain = null, backoffMain = 2000;
let circuitKey = null, track = null, carAnim = {}, telemetry = {};
let selectedDriver = null; // car number (string), selected from the Timing list or tapped on the Track map
let carScreenPos = {}; // num -> {x,y,r} last-drawn canvas position, used to hit-test taps on the track

// 2026 grid team logos (with number logos) + driver portraits, keyed by TLA.

const DRIVER_PORTRAITS = {
  NOR:"https://images.prismic.io/formula-1-dashboard/Z9VKeziBA97Gig6v_2025-norris.avif",
  PIA:"https://images.prismic.io/formula-1-dashboard/Z9VKfTiBA97Gig6x_2025-piastri.avif",

const portraitCache = {}; // tla -> {img, ok}

function deepMerge(base, patch){
  if (typeof base !== 'object' || base === null || typeof patch !== 'object' || patch === null) return patch;
  const r = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  for (const k in patch){ r[k] = (base[k] && typeof patch[k]==='object') ? deepMerge(base[k], patch[k]) : patch[k]; }
  return r;
}
function setDot(id, mode){ document.getElementById(id).className = 'dot ' + (mode==='live'?'live':mode==='off'?'off':''); }

function connectMain(){
  setDot('dotMain','connecting');
  try{ wsMain = new WebSocket(MAIN_WS); wsMain.binaryType = 'arraybuffer'; }catch(e){ scheduleMain(); return; }
  wsMain.onopen = () => { setDot('dotMain','live'); backoffMain = 2000; };
  wsMain.onmessage = (evt) => {
    let raw;
    try{
      raw = (evt.data instanceof ArrayBuffer) ? new TextDecoder().decode(pako.inflate(new Uint8Array(evt.data))) : evt.data;
      const obj = JSON.parse(raw);
      if (obj && obj.type==='bundle' && Array.isArray(obj.messages)) obj.messages.forEach(processMainMsg);
      else processMainMsg(obj);

  };
  wsMain.onclose = () => { setDot('dotMain','off'); wsMain = null; scheduleMain(); };
  wsMain.onerror = () => {};
}
function scheduleMain(){ setTimeout(connectMain, backoffMain); backoffMain = Math.min(backoffMain*1.6, 20000); }

function processMainMsg(msg){
  if (!msg || typeof msg !== 'object') return;
  if (msg.R && typeof msg.R === 'object'){ applyMainInitial(msg.R); return; }
  if (Array.isArray(msg.M)){
    msg.M.forEach(entry => {
      if (entry && entry.H==='Streaming' && entry.M==='feed' && Array.isArray(entry.A) && entry.A.length>=2) applyMainFeed(entry.A[0], entry.A[1]);
    });
    return;
  }
  if (Array.isArray(msg) && msg.length>=2 && typeof msg[0]==='string') applyMainFeed(msg[0], msg[1]);
}
function applyMainInitial(initial){
  for (const k in initial){
    if (k.slice(-2)==='.z'){ routeCompressed(k, initial[k]); continue; }
    state[k] = deepMerge(state[k] || {}, initial[k]);
  }
  if (initial.SessionInfo) trackSessionKey(initial.SessionInfo);
  if (state.ExtrapolatedClock) captureClock(state.ExtrapolatedClock);
}
function applyMainFeed(key, value){
  if (key.slice(-2)==='.z'){ routeCompressed(key, value); return; }

  if (key==='ExtrapolatedClock') captureClock(state[key]);

// Session clock ticks down/up client-side between feed updates — the feed only
// pushes a new "Remaining" string occasionally, so we anchor it to performance.now()
// and extrapolate every animation frame for a smooth, accurate-looking readout.
let clockBase = null; // {ms, at, extrapolating}
function parseClockStr(s){
  if (!s || typeof s !== 'string') return null;
  const parts = s.split(':').map(Number);
  if (!parts.length || parts.some(isNaN)) return null;
  let ms = 0;
  if (parts.length===3) ms = (parts[0]*3600 + parts[1]*60 + parts[2]) * 1000;
  else if (parts.length===2) ms = (parts[0]*60 + parts[1]) * 1000;
  else ms = parts[0] * 1000;
  return ms;
}
function captureClock(c){
  const ms = parseClockStr(c && c.Remaining);
  if (ms===null) return;
  clockBase = { ms, at: performance.now(), extrapolating: !!(c && c.Extrapolating) };
}
function fmtClock(ms){
  if (ms < 0) ms = 0;
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  return (h>0 ? String(h).padStart(2,'0')+':' : '') + String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderClock(){
  const el = document.getElementById('wClock');
  if (!clockBase){ el.textContent = '—'; return; }
  const elapsed = clockBase.extrapolating ? (performance.now() - clockBase.at) : 0;
  el.textContent = fmtClock(clockBase.ms - elapsed);
}

function routeCompressed(key, blob){

  else if (key.indexOf('CarData')===0) decodeCarDataBlob(blob);

function trackSessionKey(info){

function inflateBlob(b64){
  const bin = atob(b64), bytes = new Uint8Array(bin.length);

// Smoothed positions: each new frame becomes a tween target from the
// currently-interpolated point, so the track view never snaps (ported/
// extended from track.html's carPos tween approach).
function decodePositionBlob(b64){
  if (!b64 || typeof b64 !== 'string') return;
  try{
    const parsed = inflateBlob(b64);
    const frames = parsed && parsed.Position;
    if (!Array.isArray(frames) || !frames.length) return;
    const latest = frames[frames.length-1];
    if (!latest || !latest.Entries) return;
    const now = performance.now();
    for (const num in latest.Entries){
      const e = latest.Entries[num];
      if (typeof e.X !== 'number' || typeof e.Y !== 'number') continue;
      const prev = carAnim[num];
      if (!prev){ carAnim[num] = {sx:e.X, sy:e.Y, tx:e.X, ty:e.Y, st:now, dur:300}; continue; }
      const t = Math.min(1, (now - prev.st) / prev.dur);
      const cx = prev.sx + (prev.tx - prev.sx) * t, cy = prev.sy + (prev.ty - prev.sy) * t;
      carAnim[num] = {sx:cx, sy:cy, tx:e.X, ty:e.Y, st:now, dur: prev._interval ? Math.min(1200, Math.max(180, prev._interval)) : 300, _interval: now - prev.st};
    }

}
// CarData.z → per-driver telemetry. Channel numbering: 0 RPM, 2 Speed, 3 nGear,
// 4 Throttle, 5 Brake, 45 DRS, plus the 2026 channels — 46 Active Aero State
// (0 = high-downforce/Corner Mode, 1 = wings shed drag/Straight Mode) and
// 47 Manual Override/Overtake (0 = standard deployment, 1 = full override deployed).
function decodeCarDataBlob(b64){
  if (!b64 || typeof b64 !== 'string') return;
  try{
    const parsed = inflateBlob(b64);
    const frames = parsed && parsed.Entries;
    if (!Array.isArray(frames) || !frames.length) return;
    const latest = frames[frames.length-1];
    const cars = latest.Cars || {};
    for (const num in cars){
      const ch = (cars[num].Channels) || {};
      telemetry[num] = {
        rpm: ch['0'], speed: ch['2'], gear: ch['3'],
        throttle: ch['4'] ?? 0, brake: ch['5'] ?? 0, drs: ch['45'],

}

// Renders the granular minisector bar seen on the broadcast graphic. TimingData
// Sectors[i].Segments carries a Status code per minisector on the full feed
// (2051 purple/overall-best, 2048 green/personal-best, 2049 yellow/running);
// falls back to one wide chunk per sector when segment-level data isn't present.
function segmentBar(sectors){
  if (!Array.isArray(sectors) || !sectors.length) return '<div class="segbar"><span class="seg"></span><span class="seg"></span><span class="seg"></span></div>';
  const segs = [];
  sectors.slice(0,3).forEach(s=>{
    const v = (s && typeof s==='object') ? s : {Value:s};
    if (Array.isArray(v.Segments) && v.Segments.length){
      v.Segments.forEach(seg=>{
        const st = seg && seg.Status;
        let cls='';
        if (st===2051) cls='p'; else if (st===2048) cls='g'; else if (st===2049) cls='y'; else if (st===2052||st===2064) cls='b';
        segs.push(cls);
      });
    } else {
      let cls=''; if (v.OverallFastest) cls='p'; else if (v.PersonalFastest) cls='g'; else if (v.Value) cls='y';
      segs.push(cls,cls,cls,cls,cls,cls);
    }
  });
  return '<div class="segbar">' + segs.map(c=>`<span class="seg ${c}"></span>`).join('') + '</div>';
}
function sectorCls(s){
  const v = (s && typeof s==='object') ? s : {Value:s};

function tyreBadge(stint){

    const pUrl = portraitUrl(tla);
    const lines = (r.transcript||[]).map(seg =>
      `<div class="line"><b>${seg.speaker==='driver' ? (tla || 'DRV') : 'PIT'}</b>${seg.en || seg.es || ''}</div>`
    ).join('');
    const player = r.recording_url ? `<div class="player" data-idx="${i}">
        <button class="playbtn" data-src="${r.recording_url}"></button>
        <div class="ptrack"><div class="pfill"></div></div>
        <span class="ptime">0:00</span>
      </div>` : '';
    return `<div class="rcard" style="border-left-color:${color}">
      <div class="rmeta">${pUrl?`<img class="ravatar" src="${pUrl}" alt="" onerror="this.style.visibility='hidden'">`:''}<span class="rtla" style="color:${color}">${tla || r.driver_number}</span><span class="rtime">${t}</span></div>
      ${player}
      ${lines || '<div class="empty" style="padding:4px 0;">No transcript</div>'}
    </div>`;
  }).join('');
}
// Event delegation so the custom player survives rebuilds without re-binding per element.
document.getElementById('radioFilter').addEventListener('change', ()=>{ radioDirty = true; });
document.getElementById('radioList').addEventListener('click', (e)=>{
  const btn = e.target.closest('.playbtn');
  const track = e.target.closest('.ptrack');
  if (btn){
    const player = btn.closest('.player');
    let audio = player.querySelector('audio');
    if (!audio){
      audio = document.createElement('audio');
      audio.src = btn.dataset.src; audio.preload = 'metadata';
      player.appendChild(audio);
      audio.addEventListener('timeupdate', ()=>{
        const fill = player.querySelector('.pfill'), time = player.querySelector('.ptime');
        if (audio.duration) fill.style.width = (audio.currentTime/audio.duration*100)+'%';
        time.textContent = fmtTime(audio.duration - audio.currentTime || 0);
      });
      audio.addEventListener('play', ()=>{ audio.dataset.touched='1'; audio.dataset.playing='1'; btn.classList.remove('error'); btn.classList.add('playing'); });
      audio.addEventListener('pause', ()=>{ audio.dataset.playing='0'; btn.classList.remove('playing'); });
      audio.addEventListener('ended', ()=>{ audio.dataset.playing='0'; audio.dataset.touched='0'; btn.classList.remove('playing'); player.querySelector('.pfill').style.width='0%'; });
      audio.addEventListener('error', ()=>{ audio.dataset.playing='0'; audio.dataset.touched='0'; btn.classList.remove('playing'); btn.classList.add('error'); });
    }
    // pause any other playing clip first
    document.querySelectorAll('#radioList audio').forEach(a=>{ if (a!==audio && !a.paused) a.pause(); });
    if (audio.paused){
      // mark touched *before* play() resolves so a radio-snapshot rebuild
      // mid-load can't rip the element out from under the pending play() call
      audio.dataset.touched = '1';
      const p = audio.play();
      if (p && typeof p.catch === 'function'){
        p.catch((err)=>{
          console.warn('Radio playback failed:', err);
          audio.dataset.touched = '0';
          btn.classList.remove('playing');
          btn.classList.add('error');
        });
      }
    } else {
      audio.pause();
    }
  } else if (track){
    const audio = track.closest('.player').querySelector('audio');
    if (audio && audio.duration){
      const r = track.getBoundingClientRect();
      audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
    }
  }
});

/* ============================================================
   RENDER — track canvas, smoothed via carAnim tween, driver portraits
   ============================================================ */
const cv = document.getElementById('trackCanvas'), ctx = cv.getContext('2d');
function resizeCanvas(){
  const wrap = document.getElementById('trackView');
  cv.width = wrap.clientWidth * devicePixelRatio; cv.height = wrap.clientHeight * devicePixelRatio;
  cv.style.width = wrap.clientWidth+'px'; cv.style.height = wrap.clientHeight+'px';
}
window.addEventListener('resize', resizeCanvas);
function fitTrack(){
  const xs = track.x, ys = track.y;
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const w=maxX-minX||1, h=maxY-minY||1, pad=40*devicePixelRatio;
  return {minX,minY,w,h, scale:Math.min((cv.width-pad*2)/w,(cv.height-pad*2)/h), cx:cv.width/2, cy:cv.height/2};
}
function project(x,y,f){ return { x: f.cx + (x-f.minX-f.w/2)*f.scale, y: f.cy - (y-f.minY-f.h/2)*f.scale }; }
function drawTrack(){
  ctx.clearRect(0,0,cv.width,cv.height);
  if (!track){
    ctx.fillStyle = '#84838c'; ctx.font = (13*devicePixelRatio)+'px monospace'; ctx.textAlign='center';
    ctx.fillText(circuitKey ? 'No circuit map for this session' : 'Waiting for session info…', cv.width/2, cv.height/2);
    return;
  }
  const f = fitTrack();
  ctx.strokeStyle = '#3a3a42'; ctx.lineWidth = 8*devicePixelRatio; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  track.x.forEach((x,i)=>{ const p=project(x, track.y[i], f); i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); });
  ctx.stroke();
  (track.corners||[]).forEach(c=>{
    const cx = c.trackPosition ? c.trackPosition.x : undefined, cy = c.trackPosition ? c.trackPosition.y : undefined;
    if (cx===undefined) return;
    const p = project(cx, cy, f);
    ctx.fillStyle='#26262e'; ctx.beginPath(); ctx.arc(p.x,p.y,10*devicePixelRatio,0,7); ctx.fill();
    ctx.fillStyle='#84838c'; ctx.font=(9*devicePixelRatio)+'px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(c.number ?? '', p.x, p.y);
  });
  const now = performance.now();
  const drivers = state.DriverList || {};
  const R = 11*devicePixelRatio;
  carScreenPos = {};
  for (const num in carAnim){
    const a = carAnim[num];
    const t = Math.min(1, (now - a.st) / a.dur);
    const x = a.sx + (a.tx - a.sx) * t, y = a.sy + (a.ty - a.sy) * t;
    const drv = drivers[num] || {};
    const p = project(x, y, f);
    carScreenPos[num] = {x:p.x, y:p.y, r:R};
    const color = drv.TeamColour ? '#'+drv.TeamColour.replace('#','') : '#eceae4';
    const label = drv.Tla || num; // "VER"-like tag
    const carNo = drv.RacingNumber || num;
    const isSelected = selectedDriver === num;

    if (isSelected){
      // pulsing halo behind the selected car
      const pulse = 1 + 0.18 * Math.sin(now/220);
      ctx.strokeStyle = '#4fd8e8';
      ctx.lineWidth = 2*devicePixelRatio;
      ctx.beginPath(); ctx.arc(p.x,p.y,(R+6*devicePixelRatio)*pulse,0,Math.PI*2); ctx.stroke();
    }

    // dot
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(p.x,p.y,R,0,Math.PI*2); ctx.fill();
    if (isSelected){ ctx.strokeStyle='#0a0a0c'; ctx.lineWidth=2*devicePixelRatio; ctx.stroke(); }

    // TLA label, e.g. "VER"
    ctx.fillStyle='#0a0a0c'; ctx.font='bold '+(8.5*devicePixelRatio)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label.slice(0,3), p.x, p.y);

    // small car-number badge, top-right of the dot
    const bx = p.x + R*0.78, by = p.y - R*0.78, br = 6.5*devicePixelRatio;
    ctx.fillStyle = '#0a0a0c'; ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 1.3*devicePixelRatio; ctx.stroke();
    ctx.fillStyle = '#eceae4'; ctx.font = 'bold '+(7*devicePixelRatio)+'px monospace';
    ctx.fillText(String(carNo), bx, by+0.5*devicePixelRatio);
  }
}
// Tap a car on the track map to select/deselect it (mirrors the Timing-list click).
cv.addEventListener('click', (e)=>{
  const rect = cv.getBoundingClientRect();
  const x = (e.clientX - rect.left) * devicePixelRatio, y = (e.clientY - rect.top) * devicePixelRatio;
  let hit = null, hitDist = Infinity;
  for (const num in carScreenPos){
    const c = carScreenPos[num];
    const d = Math.hypot(x - c.x, y - c.y);
    if (d <= c.r * 1.8 && d < hitDist){ hit = num; hitDist = d; }
  }
  if (hit){ selectedDriver = (selectedDriver === hit) ? null : hit; renderTiming(); }
});

/* ============================================================
   RENDER LOOP — throttled full rebuilds (kills the flicker),
   track canvas still redraws every frame for smooth tweening
   ============================================================ */
let lastFullRender = 0;
function render(now){
  if (dirty && now - lastFullRender > 500){
    dirty = false; lastFullRender = now;
    renderStatusBar(); renderTiming(); renderRC(); renderLap();
  }
  renderClock();
  if (radioDirty && now - lastFullRender > 500){ radioDirty = false; renderRadio(); }
  if (document.getElementById('view-track').classList.contains('on')) drawTrack();
  requestAnimationFrame(render);
}

document.querySelectorAll('nav button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
    btn.classList.add('on'); document.getElementById('view-'+btn.dataset.view).classList.add('on');
    if (btn.dataset.view==='track') resizeCanvas();
  });
});

resizeCanvas();
connectMain();
connectRadio();
requestAnimationFrame(render);
</script>
</body>
